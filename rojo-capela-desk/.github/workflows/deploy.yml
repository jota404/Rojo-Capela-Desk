name: CD - MiniDesk

on:
  workflow_run:
    workflows:
      - CI - MiniDesk
    types:
      - completed
    branches:
      - main

jobs:
  verificar-hook:
    name: Verificar deploy hook
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      configurado: ${{ steps.verificar.outputs.configurado }}
    steps:
      - name: Verificar secret do Render
        id: verificar
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy no Render
    needs: verificar-hook
    if: ${{ needs.verificar-hook.outputs.configurado == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Render
        run: curl --fail --request POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
