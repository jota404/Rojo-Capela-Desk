name: CI

on:
push:
branches: [ main, quagmire77-patch-1 ]
pull_request:
branches: [ main ]

jobs:
validate:
runs-on: ubuntu-latest

steps:
  - name: Checkout do código
    uses: actions/checkout@v4
    
  - name: Setup do Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      
  - name: Instalar dependências
    run: npm ci
    
  - name: Executar testes automatizados
    run: npm test
    
  - name: Realizar o Build (Frontend Vite)
    run: npm run build
