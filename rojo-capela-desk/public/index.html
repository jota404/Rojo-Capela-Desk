<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniDesk</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <div>
          <p class="eyebrow">Central de suporte</p>
          <h1>MiniDesk</h1>
          <p class="subtitle">Acompanhe e resolva chamados com clareza.</p>
        </div>
        <div class="summary" aria-label="Resumo dos chamados">
          <div class="summary-item">
            <strong id="total-chamados">0</strong>
            <span>Total</span>
          </div>
          <div class="summary-item">
            <strong id="chamados-pendentes">0</strong>
            <span>Pendentes</span>
          </div>
        </div>
      </header>

      <div id="mensagem-erro" class="error-message" role="alert" hidden></div>

      <section class="panel" aria-labelledby="novo-chamado-titulo">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Novo registro</p>
            <h2 id="novo-chamado-titulo">Abrir chamado</h2>
          </div>
          <span class="section-mark">+</span>
        </div>
        <form id="form-chamado">
          <div class="form-grid">
            <label>
              Título
              <input name="titulo" type="text" placeholder="Ex.: Acesso ao sistema" required />
            </label>
            <label>
              Solicitante
              <input name="solicitante" type="text" placeholder="Nome da pessoa" required />
            </label>
            <label>
              Prioridade
              <select name="prioridade">
                <option value="baixa">Baixa</option>
                <option value="media" selected>Média</option>
                <option value="alta">Alta</option>
              </select>
            </label>
            <label class="field-wide">
              Descrição
              <textarea name="descricao" rows="4" placeholder="Descreva o que aconteceu" required></textarea>
            </label>
          </div>
          <div class="form-actions">
            <button class="button-primary" type="submit">Abrir chamado</button>
          </div>
        </form>
      </section>

      <section class="ticket-section" aria-labelledby="lista-titulo">
        <div class="list-header">
          <div>
            <p class="eyebrow">Acompanhamento</p>
            <h2 id="lista-titulo">Chamados</h2>
          </div>
          <div class="filters" aria-label="Filtros de chamados">
            <label>
              Status
              <select id="filtro-status">
                <option value="">Todos</option>
                <option value="aberto">Aberto</option>
                <option value="em_andamento">Em andamento</option>
                <option value="resolvido">Resolvido</option>
              </select>
            </label>
            <label>
              Prioridade
              <select id="filtro-prioridade">
                <option value="">Todas</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
              </select>
            </label>
          </div>
        </div>
        <div id="lista-chamados" class="tickets-list" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
